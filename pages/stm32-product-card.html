<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STM32物联网智能时钟 - 商品详情</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #0c1445 0%, #1a237e 50%, #0d47a1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .product-card {
            background: linear-gradient(145deg, #1e3a5f 0%, #0d2137 100%);
            border-radius: 24px;
            padding: 48px;
            max-width: 1200px;
            width: 100%;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 100px rgba(33, 150, 243, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(33, 150, 243, 0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #2196f3 0%, #1976d2 100%);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 30px rgba(33, 150, 243, 0.4);
        }

        .logo img {
            width: 60px;
            height: 60px;
            filter: brightness(1.1);
        }

        .brand-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 2px;
        }

        .brand-slogan {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
        }

        .title-section {
            text-align: right;
        }

        .product-title {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: 3px;
            text-shadow: 0 2px 10px rgba(33, 150, 243, 0.3);
        }

        .product-subtitle {
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(90deg, #2196f3, #4fc3f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 4px;
        }

        .main-content {
            display: flex;
            gap: 60px;
            position: relative;
            z-index: 1;
        }

        .features-list {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .feature-item {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .feature-item:hover {
            background: linear-gradient(145deg, rgba(33, 150, 243, 0.2) 0%, rgba(255, 255, 255, 0.05) 100%);
            border-color: rgba(33, 150, 243, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(33, 150, 243, 0.2);
        }

        .feature-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #2196f3 0%, #1565c0 100%);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .feature-text {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 1px;
        }

        .board-display {
            flex: 1.2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .board-container {
            position: relative;
        }

        .circuit-board {
            width: 420px;
            height: 300px;
            background: linear-gradient(145deg, #1a4d3a 0%, #0d2d22 100%);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.6),
                0 0 60px rgba(76, 175, 80, 0.2);
            border: 3px solid #2d5a4a;
            position: relative;
            overflow: hidden;
        }

        .circuit-board::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 10px 10px;
            pointer-events: none;
        }

        .component {
            position: absolute;
            background: linear-gradient(145deg, #1e3a8a 0%, #1e40af 100%);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(30, 58, 138, 0.4);
            border: 2px solid #3b82f6;
        }

        .component.stm32 {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 60px;
            background: linear-gradient(145deg, #1e3a8a 0%, #0f172a 100%);
            border-color: #2563eb;
        }

        .component.stm32 span {
            color: #60a5fa;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .component.esp8266 {
            top: 20px;
            left: 30px;
            width: 100px;
            height: 40px;
            background: linear-gradient(145deg, #7c3aed 0%, #5b21b6 100%);
            border-color: #a855f7;
        }

        .component.esp8266 span {
            color: #c4b5fd;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .component.oled {
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 50px;
            background: #0f172a;
            border-color: #06b6d4;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 6px;
        }

        .oled-time {
            color: #22d3ee;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
        }

        .oled-status {
            color: #10b981;
            font-size: 10px;
            font-weight: 500;
        }

        .component.rtc {
            top: 30px;
            right: 30px;
            width: 60px;
            height: 40px;
            background: linear-gradient(145deg, #059669 0%, #047857 100%);
            border-color: #10b981;
            border-radius: 50%;
        }

        .component.rtc span {
            color: #6ee7b7;
            font-size: 9px;
            font-weight: 600;
        }

        .component.dht {
            bottom: 35px;
            left: 30px;
            width: 50px;
            height: 30px;
            background: linear-gradient(145deg, #ea580c 0%, #c2410c 100%);
            border-color: #fb923c;
            border-radius: 6px;
        }

        .component.dht span {
            color: #fdba74;
            font-size: 9px;
            font-weight: 600;
        }

        .component.buzzer {
            bottom: 35px;
            right: 30px;
            width: 50px;
            height: 30px;
            background: linear-gradient(145deg, #dc2626 0%, #b91c1c 100%);
            border-color: #f87171;
            border-radius: 6px;
        }

        .component.buzzer span {
            color: #fca5a5;
            font-size: 9px;
            font-weight: 600;
        }

        .led {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        .led.red {
            bottom: 90px;
            right: 100px;
            background: #ef4444;
            box-shadow: 0 0 15px #ef4444;
        }

        .led.yellow {
            bottom: 90px;
            right: 80px;
            background: #eab308;
            box-shadow: 0 0 15px #eab308;
        }

        .led.green {
            bottom: 90px;
            right: 60px;
            background: #22c55e;
            box-shadow: 0 0 15px #22c55e;
        }

        .usb-cable {
            position: absolute;
            right: -60px;
            top: 50%;
            transform: translateY(-50%);
            width: 80px;
            height: 20px;
            background: linear-gradient(180deg, #374151 0%, #1f2937 100%);
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        .footer {
            margin-top: 32px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .tech-stack {
            display: inline-flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 12px 32px;
        }

        .tech-tag {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            padding: 6px 16px;
            background: linear-gradient(135deg, rgba(33, 150, 243, 0.2) 0%, rgba(33, 150, 243, 0.05) 100%);
            border-radius: 20px;
            border: 1px solid rgba(33, 150, 243, 0.3);
        }

        @media (max-width: 1024px) {
            .main-content {
                flex-direction: column;
                gap: 40px;
            }

            .features-list {
                grid-template-columns: 1fr;
            }

            .circuit-board {
                width: 100%;
                max-width: 420px;
            }

            .product-title {
                font-size: 22px;
            }

            .product-subtitle {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="product-card">
        <div class="header">
            <div class="logo-section">
                <div class="logo">
                    <svg viewBox="0 0 60 60" fill="none">
                        <circle cx="30" cy="30" r="25" fill="rgba(255,255,255,0.15)"/>
                        <path d="M30 5 L30 55 M5 30 L55 30" stroke="white" stroke-width="1.5" stroke-opacity="0.6"/>
                        <circle cx="30" cy="30" r="8" fill="#2196f3"/>
                        <path d="M26 30 L34 30 M30 26 L30 34" stroke="white" stroke-width="2"/>
                        <circle cx="18" cy="18" r="3" fill="white" opacity="0.8"/>
                        <circle cx="42" cy="18" r="3" fill="white" opacity="0.8"/>
                        <circle cx="18" cy="42" r="3" fill="white" opacity="0.8"/>
                        <circle cx="42" cy="42" r="3" fill="white" opacity="0.8"/>
                        <path d="M18 18 L26 26 M42 18 L34 26 M18 42 L26 34 M42 42 L34 34" stroke="white" stroke-width="1.5" stroke-opacity="0.6"/>
                    </svg>
                </div>
                <div class="brand-info">
                    <div class="brand-name">夏侯电子工坊</div>
                    <div class="brand-slogan">嵌入式单片机开发</div>
                </div>
            </div>
            <div class="title-section">
                <div class="product-title">STM32项目</div>
                <div class="product-subtitle">物联网智能时钟</div>
            </div>
        </div>

        <div class="main-content">
            <div class="features-list">
                <div class="feature-item">
                    <div class="feature-icon">🕐</div>
                    <span class="feature-text">联网校时</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">📺</div>
                    <span class="feature-text">OLED显示</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🔔</div>
                    <span class="feature-text">闹钟提醒</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">⌨️</div>
                    <span class="feature-text">按键设置</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">📶</div>
                    <span class="feature-text">WiFi控制</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🌡️</div>
                    <span class="feature-text">温湿度显示</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🔄</div>
                    <span class="feature-text">远程同步</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">📚</div>
                    <span class="feature-text">课程设计</span>
                </div>
            </div>

            <div class="board-display">
                <div class="board-container">
                    <div class="circuit-board">
                        <div class="component stm32"><span>STM32F103</span></div>
                        <div class="component esp8266"><span>ESP8266</span></div>
                        <div class="component oled">
                            <span class="oled-time">12:30</span>
                            <span class="oled-status">WiFi OK</span>
                        </div>
                        <div class="component rtc"><span>RTC</span></div>
                        <div class="component dht"><span>DHT</span></div>
                        <div class="component buzzer"><span>BUZ</span></div>
                        <div class="led red"></div>
                        <div class="led yellow"></div>
                        <div class="led green"></div>
                    </div>
                    <div class="usb-cable"></div>
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="tech-stack">
                <span class="tech-tag">STM32</span>
                <span class="tech-tag">ESP8266</span>
                <span class="tech-tag">OLED</span>
            </div>
        </div>
    </div>
</body>
</html>
